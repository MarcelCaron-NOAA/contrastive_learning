name: contrastive-learning
channels:
  - conda-forge

dependencies:
  # URSA research environment. Keep this list intentionally small and focused
  # on packages imported by the reproducible workflow.
  - python=3.11
  - pip
  - numpy>=2.4,<2.5
  - pandas>=3.0,<3.1
  - scipy>=1.17,<1.18
  - xarray>=2026.7,<2027
  - zarr>=2.18,<3
  - numcodecs
  - s3fs
  - matplotlib>=3.11,<3.12
  - cartopy>=0.25,<0.26
  - pyyaml>=6,<7
  - tqdm>=4.70,<5
  - pytest>=8,<10
  - pip:
      # The completed experiments used the CUDA 12.8 PyTorch build on URSA.
      # PyPI resolves the associated NVIDIA CUDA runtime packages.
      - torch==2.11.0
      - torchvision==0.26.0
